name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установка
        run: python -m pip install -e ".[test]"
      - name: Статический анализ
        run: python -m pyflakes aprepro tests
      - name: Тесты
        run: python -m pytest -q
      - name: План совпадает со снимком манифеста
        run: |
          python -m aprepro plan --manifest data/manifest-2026-11-06.json.gz \
            --manifest-meta data/manifest-2026-11-06.meta.json --out "$RUNNER_TEMP/plan.json" \
            --tag-group Copter-4.6.3 --seed ca5c3a1cc65baa5d8412babfb3a1be4a933bdb32d152e4565285a8d6b8b94b6a
          python - "$RUNNER_TEMP/plan.json" plans/study-2026-11.json <<'PY'
          import json, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:])
          for p in (a, b):
              p.pop("created")
          assert a == b, "план не воспроизводится из снимка манифеста"
          print("план воспроизводится:", sum(len(g["targets"]) for g in a["groups"]), "сборок")
          PY
      - name: Отчёт совпадает с результатами
        run: python -m aprepro report plans/study-2026-11.json --md docs/results.md --readme README.md --check

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12 (SHA-256 закреплён)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
